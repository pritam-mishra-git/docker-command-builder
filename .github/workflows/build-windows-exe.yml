name: Build Windows Installer

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main, Pritam ]
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install WiX Toolset (required by jpackage for .exe/.msi)
        run: choco install wixtoolset -y

      - name: Build jar with Maven
        run: mvn -B clean package -DskipTests

      - name: Package as Windows .exe installer with jpackage
        shell: pwsh
        run: |
          jpackage `
            --input target `
            --main-jar docker-command-builder.jar `
            --main-class org.springframework.boot.loader.launch.JarLauncher `
            --name "Docker Command Builder" `
            --app-version 1.0 `
            --type exe `
            --icon installer-assets/icon.ico `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser `
            --dest dist

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-command-builder-windows-installer
          path: dist/*.exe
